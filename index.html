let current=0;

let geoLayer=null;

let capitalMarkers=[];

let provinceLabels=[];

let mapReady=false;

const map=L.map("map",{scrollWheelZoom:true}).setView([32.5,53.5],5);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{

  maxZoom:10,

  attribution:'© OpenStreetMap contributors'

}).addTo(map);

const provinceStyle={

  color:"#416d8d",

  weight:1.4,

  fillColor:"#b9d5e8",

  fillOpacity:0.55

};

function normalize(value){

  return String(value||"")

    .replace(/[\u200e\u200f]/g,"")

    .replace(/\s+/g," ")

    .trim()

    .toLowerCase();

}

function getEnglishName(feature){

  const p=feature.properties||{};

  return normalize(p["name:en"]||p.name_en||p.name);

}

function clearProvinceLabels(){

  provinceLabels.forEach(layer=>map.removeLayer(layer));

  provinceLabels=[];

}

function addProvinceLabels(){

  if(!geoLayer)return;

  clearProvinceLabels();

  geoLayer.eachLayer(layer=>{

    const p=layer.feature.properties||{};

    const english=getEnglishName(layer.feature);

    const item=provinces.find(x=>normalize(x.en)===english);

    if(!item)return;

    const center=layer.getBounds().getCenter();

    const label=L.marker(center,{

      interactive:false,

      icon:L.divIcon({

        className:"",

        html:`<span class="province-label">${item.name}</span>`,

        iconSize:null

      })

    }).addTo(map);

    provinceLabels.push(label);

  });

}

function addAllCapitals(){

  capitalMarkers.forEach(m=>map.removeLayer(m));

  capitalMarkers=[];

  provinces.forEach(p=>{

    const marker=L.marker([p.lat,p.lng],{

      icon:L.divIcon({

        className:"",

        html:'<span style="font-size:15px">📍</span>',

        iconSize:[20,20],

        iconAnchor:[10,10]

      })

    }).bindTooltip(p.capital,{

      permanent:true,

      direction:"top",

      offset:[0,-8],

      className:"capital-label"

    }).addTo(map);

    capitalMarkers.push(marker);

  });

}

function findFeature(item){

  if(!geoLayer)return null;

  let found=null;

  geoLayer.eachLayer(layer=>{

    if(getEnglishName(layer.feature)===normalize(item.en)){

      found=layer;

    }

  });

  return found;

}

function updateProvince(){

  const p=provinces[current];

  document.getElementById("provinceName").textContent=p.name;

  document.getElementById("capitalName").textContent="مرکز استان: "+p.capital;

  document.getElementById("population").textContent=p.pop;

  document.getElementById("area").textContent=p.area;

  document.getElementById("description").textContent=p.description;

  const facts=document.getElementById("facts");

  facts.innerHTML="";

  p.facts.forEach(f=>{

    const div=document.createElement("div");

    div.className="fact";

    div.textContent="• "+f;

    facts.appendChild(div);

  });

  document.getElementById("previous").disabled=current===0;

  document.getElementById("next").disabled=current===provinces.length-1;

  if(geoLayer){

    geoLayer.eachLayer(layer=>{

      layer.setStyle(provinceStyle);

    });

    const selected=findFeature(p);

    if(selected){

      selected.setStyle({

        color:"#123d63",

        weight:3,

        fillColor:"#f0b84c",

        fillOpacity:0.8

      });

      selected.bringToFront();

      map.fitBounds(selected.getBounds(),{padding:[35,35],maxZoom:7});

    }else{

      map.setView([p.lat,p.lng],6);

    }

  }else{

    map.setView([p.lat,p.lng],6);

  }

}

document.getElementById("previous").addEventListener("click",()=>{

  if(current>0){

    current--;

    updateProvince();

  }

});

document.getElementById("next").addEventListener("click",()=>{

  if(current<provinces.length-1){

    current++;

    updateProvince();

  }

});

async function loadProvinceMap(){

  const status=document.getElementById("mapStatus");

  try{

    const response=await fetch(

      "https://raw.githubusercontent.com/hosseinhabibi2004/iran-geojson/master/data/provinces/provinces.geojson"

    );

    if(!response.ok)throw new Error("Map download failed");

    const geojson=await response.json();

    geoLayer=L.geoJSON(geojson,{

      style:provinceStyle,

      onEachFeature:(feature,layer)=>{

        const english=getEnglishName(feature);

        const item=provinces.find(p=>normalize(p.en)===english);

        if(item){

          layer.on("click",()=>{

            const index=provinces.indexOf(item);

            if(index!==-1){

              current=index;

              updateProvince();

            }

          });

        }

      }

    }).addTo(map);

    addProvinceLabels();

    addAllCapitals();

    map.fitBounds(geoLayer.getBounds(),{padding:[15,15]});

    mapReady=true;

    status.textContent="";

    updateProvince();

  }catch(error){

    status.textContent="بارگذاری مرزهای استان‌ها انجام نشد؛ اتصال اینترنت را بررسی کن.";

  }

}

updateProvince();

loadProvinceMap();

</script>
